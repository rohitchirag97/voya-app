buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// ZEGOCLOUD Express SDK (im.zego:express-video) is hosted on ZEGO's own Maven repo; the profile-photo cropper
// (react-native-image-crop-picker -> uCrop) is on JitPack.
allprojects {
    repositories {
        maven { url "https://storage.zego.im/maven" }
        maven { url "https://jitpack.io" }
    }
}

// zego-express-engine-reactnative declares BuildConfig fields; AGP 9 disables BuildConfig by default.
subprojects {
    if (name == "zego-express-engine-reactnative") {
        plugins.withId("com.android.library") {
            android.buildFeatures.buildConfig = true
        }
    }
}
